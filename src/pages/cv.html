<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">CV</title>
  <link rel="icon" href="../../assets/logo.png" type="image/x-icon">
  <script src="../json/candidate-data.js"></script>
  <script>
    var _c = window.CANDIDATE_DATA || {};
    if (_c.name) document.getElementById('page-title').textContent = 'CV | ' + _c.name;
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="../styles/cv.css" />
</head>
<body>
  <div id="cv-root"></div>
  <button id="btn-pdf" style="display:none" onclick="gerarPDF()">
    <i class="fa-solid fa-file-pdf"></i> Baixar PDF
  </button>

  <script src="../json/jobs-data.js"></script>
  <script src="../json/generic-cv-data.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const jobId = params.get('job');
    const root = document.getElementById('cv-root');

    function getLocationDisplay(job, candidateLocation, cvLang) {
      let location = candidateLocation || '';
      if (job.modalidade === 'Remoto') {
        const remoteText = cvLang === 'en' ? 'Open to remote work' : 'Disponível para trabalho remoto';
        return location ? `${location}, ${remoteText}` : remoteText;
      }
      return location;
    }

    function formatPhoneWithCountryCode(phone, countryCode) {
      if (!phone) return '';
      const code = countryCode || '';
      return code ? `${code} ${phone}` : phone;
    }

    function notAuthorized(msg) {
      root.innerHTML = `
        <div class="not-authorized">
          <i class="fa-solid fa-lock"></i>
          <h2 style="color:#ccc;border:none;margin:0 0 8px 0">CV não autorizado</h2>
          <p>${msg || 'Este CV ainda não foi autorizado pelo usuário.'}</p>
        </div>`;
    }

    const isGeneric = !!(window.GENERIC_CV_DATA && window.GENERIC_CV_DATA[jobId]);
    const getJobFromData = () => {
      if (isGeneric) return window.GENERIC_CV_DATA[jobId];
      if (!window.JOBS_DATA) return null;
      // Suporta tanto array quanto objeto (para compatibilidade com versão antiga)
      if (Array.isArray(window.JOBS_DATA)) {
        return window.JOBS_DATA.find(job => job.id === jobId);
      }
      return window.JOBS_DATA[jobId];
    };
    const job = getJobFromData();

    if (!jobId || !job) {
      notAuthorized(jobId ? `Vaga "${jobId}" não encontrada.` : 'Nenhum parâmetro de vaga informado na URL.');
    } else {
      const cv = job.cv;

      if (!isGeneric && (!cv || !cv.authorized)) {
        notAuthorized(`CV para "${job.vaga} - ${job.empresa}" ainda não autorizado.`);
      } else {
        const c = window.CANDIDATE_DATA || {};
        const candidateName = c.name || '';
        const candidateEmail = c.email || '';
        const candidatePhone = c.phone || '';
        const candidatePhoneCountryCode = c.phoneCountryCode || '';
        const candidateLinkedin = c.linkedin || {};

        document.documentElement.lang = job.lang || 'pt-BR';

        const isInternational = job.lang === 'en';
        const secResumo = isInternational ? 'Professional Summary' : 'Resumo Profissional';
        const secExp = isInternational ? 'Professional Experience' : 'Experiência Profissional';
        const secSkills = isInternational ? 'Technical Skills' : 'Competências Técnicas';
        const secEdu = isInternational ? 'Education' : 'Formação Acadêmica';
        const secLang = isInternational ? 'Languages' : 'Idiomas';

        const candidateLocation = cv.local || (isInternational
          ? (c.location && c.location.en) || ''
          : (c.location && c.location.pt) || '');

        const vagaLocation = getLocationDisplay(job, candidateLocation, job.lang);

        document.getElementById('page-title').textContent = `${job.vaga} - ${job.empresa} | ${candidateName}`;

        const vagaLabel = job.vaga || (job.vagaTexto || '').slice(0, 60).split('\n')[0].trim() || 'CV';
        window._pdfData = { vaga: vagaLabel, empresa: job.empresa || '', candidateName };

        const phoneHtml = candidatePhone
          ? `<a href="tel:${formatPhoneWithCountryCode(candidatePhone, candidatePhoneCountryCode)}"><i class="fa-solid fa-phone"></i> ${formatPhoneWithCountryCode(candidatePhone, candidatePhoneCountryCode)}</a>` : '';
        const emailHtml = candidateEmail
          ? `<a href="mailto:${candidateEmail}"><i class="fa-solid fa-envelope"></i> ${candidateEmail}</a>` : '';
        const linkedinHtml = candidateLinkedin.url
          ? `<a href="${candidateLinkedin.url}" target="_blank"><i class="fa-brands fa-linkedin"></i> ${candidateLinkedin.label || 'LinkedIn'}</a>` : '';
        const locationHtml = vagaLocation
          ? `<span><i class="fa-solid fa-location-dot"></i> ${vagaLocation}</span>` : '';

        window._pdfFilename = isGeneric
          ? `CV - ${candidateName} - ${job.lang === 'en' ? 'Generic EN' : 'Genérico PT'}.pdf`
          : `CV - ${candidateName} - ${job.empresa}.pdf`;

        const expHtml = (cv.experiencias || []).map(exp => `
          <div class="job-header">
            <h3>${exp.cargo}${exp.url ? ` - <a href="${exp.url}" target="_blank">${exp.empresa}</a>` : ` - ${exp.empresa}`}</h3>
            <span class="date">${exp.inicio} - ${exp.fim}</span>
          </div>
          <p class="stack">${exp.stack}</p>
          <ul>${(exp.bullets || []).map(b => `<li>${b}</li>`).join('')}</ul>
        `).join('');

        const skillsHtml = (cv.skills || []).map(s => `<span class="pill">${s}</span>`).join('');

        const eduHtml = (cv.educacao || []).map(e => `
          <div class="edu-item">
            <h3>${e.curso}</h3>
            <p class="edu-meta">${e.inst}</p>
            <p class="edu-meta">${e.periodo}</p>
          </div>
        `).join('');

        const idiomasHtml = (cv.idiomas || []).map(i => `<li>${i}</li>`).join('');

        root.innerHTML = `
          <h1>${candidateName}</h1>
          <p class="subtitle">${cv.titulo} | ${cv.subtitulo}</p>
          <div class="contact-line">
            ${locationHtml}
            ${phoneHtml}
            ${emailHtml}
            ${linkedinHtml}
          </div>

          <h2>${secResumo}</h2>
          <p>${cv.resumo}</p>

          <h2>${secExp}</h2>
          ${expHtml}

          <h2>${secSkills}</h2>
          <p class="skills-block">${skillsHtml}</p>

          <h2>${secEdu}</h2>
          <div class="edu-row">${eduHtml}</div>

          <h2>${secLang}</h2>
          <ul class="lang-list">${idiomasHtml}</ul>
        `;

        document.getElementById('btn-pdf').style.display = 'flex';
      }
    }
  </script>

  <script>
    function gerarPDF() {
      const btn = document.getElementById('btn-pdf');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Gerando...';

      const jobId = new URLSearchParams(window.location.search).get('job');
      fetch(`http://localhost:3001/pdf?job=${jobId}`)
        .then(res => {
          if (!res.ok) throw new Error('Servidor retornou erro ' + res.status);
          return res.blob();
        })
        .then(blob => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = document.title.replace(' | ', ' - ') + '.pdf';
          a.click();
          URL.revokeObjectURL(url);
        })
        .catch(err => alert('Erro ao gerar PDF.\nVerifique se o servidor está rodando:\nnpm start\n\n' + err.message))
        .finally(() => {
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-file-pdf"></i> Baixar PDF';
        });
    }
  </script>
</body>
</html>
