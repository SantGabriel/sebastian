<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="../../assets/logo.png" type="image/x-icon">
  <title id="page-title">Cover Letter</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; max-width: 680px; margin: 60px auto; padding: 0 24px; color: #333; font-size: 14px; line-height: 1.8; background: #fff; }
    .header { border-bottom: 2px solid #1a73e8; padding-bottom: 12px; margin-bottom: 32px; }
    .header h1 { font-size: 20px; color: #111; margin-bottom: 2px; }
    .header .meta { font-size: 12px; color: #777; display: flex; gap: 16px; flex-wrap: wrap; margin-top: 6px; }
    .header .meta a { color: #1a73e8; text-decoration: none; }
    .job-target { font-size: 13px; color: #555; font-style: italic; margin-bottom: 28px; }
    .cl-body p { margin-bottom: 18px; }
    .cl-body p:last-child { margin-bottom: 0; }
    .signature { margin-top: 36px; font-size: 13px; color: #555; }
    .signature strong { display: block; font-size: 14px; color: #111; margin-top: 4px; }
    @page { margin: 20mm; size: 217mm 400mm; }
    @media print { body { margin: 0; } }
    .not-authorized { text-align: center; padding: 80px 24px; color: #aaa; }
    .not-authorized i { font-size: 48px; display: block; margin-bottom: 16px; }
    #btn-pdf { position: fixed; bottom: 24px; right: 24px; background: #1a73e8; color: #fff; border: none; border-radius: 6px; padding: 10px 18px; font-size: 13px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); z-index: 999; }
    #btn-pdf:hover { background: #1558b0; }
    @media print { #btn-pdf { display: none !important; } }
    .city-warning { background: #fff8e1; border-left: 4px solid #f59e0b; padding: 10px 14px; margin-bottom: 20px; font-size: 12px; color: #92400e; border-radius: 0 4px 4px 0; }
    .city-warning i { margin-right: 6px; }
    @media print { .city-warning { display: none !important; } }
  </style>
</head>
<body>
  <div id="cl-root"></div>
  <button id="btn-pdf" style="display:none" onclick="gerarPDF()">
    <i class="fa-solid fa-file-pdf"></i> Baixar PDF
  </button>

  <script src="../json/candidate-data.js"></script>
  <script src="../json/jobs-data.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const jobId = params.get('job');
    const root = document.getElementById('cl-root');

    function notAuthorized(msg) {
      root.innerHTML = `
        <div class="not-authorized">
          <i class="fa-solid fa-lock"></i>
          <h2 style="color:#ccc">Cover Letter not authorized</h2>
          <p>${msg || 'This Cover Letter has not been authorized yet.'}</p>
        </div>`;
    }

    if (!jobId || !window.JOBS_DATA || !window.JOBS_DATA[jobId]) {
      notAuthorized(jobId ? `Job "${jobId}" not found in src/json/jobs-data.js.` : 'No job parameter provided in the URL.');
    } else {
      const job = window.JOBS_DATA[jobId];
      const cl = job.cl;
      const isEN = (job.cv && job.cv.lang === 'en') || (cl && cl.lang === 'en');

      const c = window.CANDIDATE_DATA || {};
      const name = c.name || '';
      const email = c.email || '';
      const linkedin = c.linkedin || {};
      const location = isEN
        ? (c.location && c.location.en) || (job.cv && job.cv.local) || ''
        : (c.location && c.location.pt) || (job.cv && job.cv.local) || '';

      if (!cl || !cl.authorized) {
        notAuthorized(`Cover Letter for "${job.vaga} - ${job.empresa}" not authorized yet.`);
      } else {
        document.documentElement.lang = isEN ? 'en' : 'pt-BR';
        document.getElementById('page-title').textContent = `Cover Letter - ${job.empresa} | ${name}`;

        const vagaLabel = job.vaga || (job.vagaTexto || '').slice(0, 60).split('\n')[0].trim() || 'Cover Letter';
        window._pdfData = { vaga: vagaLabel, empresa: job.empresa || '', candidateName: name };

        const paragrafosHtml = (cl.paragrafos || []).map(p => `<p>${p}</p>`).join('');
        const applicationLabel = isEN ? 'Application' : 'Candidatura';
        const closingLabel = isEN ? 'Best regards,' : 'Atenciosamente,';

        const locationHtml = location
          ? `<span><i class="fa-solid fa-location-dot"></i> ${location}</span>` : '';
        const emailHtml = email
          ? `<a href="mailto:${email}"><i class="fa-solid fa-envelope"></i> ${email}</a>` : '';
        const linkedinHtml = linkedin.url
          ? `<a href="${linkedin.url}" target="_blank"><i class="fa-brands fa-linkedin"></i> ${linkedin.label || 'LinkedIn'}</a>` : '';

        root.innerHTML = `
          <div class="header">
            <h1>${name}</h1>
            <div class="meta">
              ${locationHtml}
              ${emailHtml}
              ${linkedinHtml}
            </div>
          </div>
          <p class="job-target">${applicationLabel}: ${job.vaga} - ${job.empresa}</p>
          <div class="cl-body">${paragrafosHtml}</div>
          <div class="signature">
            ${closingLabel}
            <strong>${name}</strong>
          </div>
        `;

        document.getElementById('btn-pdf').style.display = 'flex';
      }
    }
  </script>

  <script>
    function gerarPDF() {
      const btn = document.getElementById('btn-pdf');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Gerando...';

      const jobId = new URLSearchParams(window.location.search).get('job');
      fetch(`http://localhost:3001/pdf?doc=cl&job=${jobId}`)
        .then(res => {
          if (!res.ok) throw new Error('Servidor retornou erro ' + res.status);
          return res.blob();
        })
        .then(blob => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = document.title.replace(' | ', ' - ') + '.pdf';
          a.click();
          URL.revokeObjectURL(url);
        })
        .catch(err => alert('Erro ao gerar PDF.\nVerifique se o servidor está rodando:\nnpm start\n\n' + err.message))
        .finally(() => {
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-file-pdf"></i> Baixar PDF';
        });
    }
  </script>
</body>
</html>
