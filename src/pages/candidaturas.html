<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sebastian - Candidaturas</title>
  <link rel="icon" href="../../assets/logo.png" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="../styles/candidaturas.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="app-page">

  <div class="page-header">
    <h1 class="fonte-baskerville">Candidaturas</h1>
    <h3 class="fonte-baskerville">Histórico, pipeline, fit e documentos de cada candidatura</h3>
  </div>

  <div class="filters-bar">
    <input type="search" id="filter-q" class="input filter-input" placeholder="Buscar por título ou empresa..." />
    <select id="filter-stage" class="select">
      <option value="">Todas as etapas</option>
    </select>
    <select id="filter-outcome" class="select">
      <option value="">Todos os status</option>
    </select>
    <select id="filter-sort" class="select">
      <option value="appliedAt:desc">Mais recentes primeiro</option>
      <option value="appliedAt:asc">Mais antigas primeiro</option>
      <option value="currentStageAt:desc">Última movimentação</option>
      <option value="fitScore:desc">Maior fit</option>
    </select>
  </div>

  <div id="summary-bar" class="summary-bar"></div>

  <div id="applications-container"></div>
  <div id="pagination-bar" class="pagination-bar"></div>

  <script type="module" src="../js/candidaturas.js"></script>
</body>
</html>
