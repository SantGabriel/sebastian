<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sebastian - Dashboard</title>
  <link rel="icon" href="assets/logo.png" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; max-width: 860px; margin: 40px auto; padding: 0 24px; color: #333; font-size: 14px; background: #f5f7fa; }
    .subtitle { font-size: 13px; color: #777; margin-bottom: 28px; }
    .job-card { background: #fff; border-radius: 8px; padding: 20px 24px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .card-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
    .card-header-left h2 { font-size: 16px; font-weight: bold; color: #111; }
    .card-header-left .company { font-size: 13px; color: #555; margin-top: 2px; }
    .score-badge { font-size: 18px; font-weight: bold; padding: 6px 14px; border-radius: 20px; white-space: nowrap; }
    .score-green { background: #d4edda; color: #1a6e2e; }
    .score-yellow { background: #fff3cd; color: #856404; }
    .score-red { background: #f8d7da; color: #721c24; }
    .fit-toggle { background: none; border: none; color: #1a73e8; cursor: pointer; font-size: 13px; padding: 0; margin-bottom: 10px; margin-right: 14px; }
    .vaga-toggle { background: none; border: none; color: #888; cursor: pointer; font-size: 12px; padding: 0; margin-bottom: 10px; }
    .vaga-toggle:hover { text-decoration: underline; }
    .vaga-texto { display: none; font-size: 12px; color: #555; white-space: pre-wrap; background: #fafafa; border: 1px solid #e0e0e0; border-radius: 4px; padding: 10px 12px; margin-bottom: 12px; max-height: 300px; overflow-y: auto; }
    .fit-toggle:hover { text-decoration: underline; }
    .fit-details { display: none; margin-bottom: 12px; }
    .fit-details.open { display: block; }
    .fit-section { margin-bottom: 8px; }
    .fit-section strong { font-size: 12px; text-transform: uppercase; color: #888; letter-spacing: 0.5px; display: block; margin-bottom: 4px; }
    .fit-section ul { padding-left: 18px; }
    .fit-section li { font-size: 13px; margin-bottom: 2px; }
    .fit-summary { font-size: 13px; color: #444; background: #f0f4ff; border-left: 3px solid #1a73e8; padding: 8px 12px; border-radius: 0 4px 4px 0; margin-bottom: 10px; }
    .card-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 16px; border-radius: 5px; font-size: 13px; font-weight: bold; text-decoration: none; cursor: pointer; border: none; }
    .btn-cv { background: #1a73e8; color: #fff; }
    .btn-cv:hover { background: #1558b0; }
    .btn-cl { background: #34a853; color: #fff; }
    .btn-cl:hover { background: #267a3e; }
    .btn-pending { background: #e8eaed; color: #999; cursor: default; pointer-events: none; }
    .pending-label { font-size: 12px; color: #aaa; display: flex; align-items: center; gap: 5px; align-self: center; }
    .candidatura-aviso { display: flex; align-items: center; gap: 8px; background: #fff8e1; border: 1px solid #ffe082; border-left: 3px solid #f9a825; border-radius: 4px; padding: 7px 12px; font-size: 12px; color: #5d4037; margin-bottom: 12px; flex-wrap: wrap; }
    .candidatura-aviso a { color: #e65100; font-weight: bold; text-decoration: none; margin-left: 4px; }
    .candidatura-aviso a:hover { text-decoration: underline; }
    .empty { text-align: center; color: #aaa; margin-top: 60px; font-size: 15px; }
    .empty i { font-size: 36px; display: block; margin-bottom: 12px; }
    .city-warning { background: #fff8e1; border-left: 3px solid #f59e0b; padding: 7px 12px; font-size: 12px; color: #92400e; border-radius: 0 4px 4px 0; margin-bottom: 12px; }
    .city-warning i { margin-right: 6px; }
    .generic-bar { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
    .generic-bar span { font-size: 13px; color: #888; align-self: center; margin-right: 4px; }
    .candidato-checkbox { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: #f0f9ff; border: 1px solid #c7e9f5; border-radius: 5px; cursor: pointer; user-select: none; font-size: 13px; color: #0c5aa0; font-weight: 500; margin-top: 10px; }
    .candidato-checkbox:hover { background: #e0f2ff; border-color: #91d5ff; }
    .candidato-checkbox input[type="checkbox"] { cursor: pointer; accent-color: #1a73e8; }
    .candidato-checkbox.marcado { background: #d4edda; border-color: #b1dfbb; color: #1a6e2e; }
    .candidato-checkbox.marcado input[type="checkbox"] { accent-color: #34a853; }
    .vaga-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #1a73e8; text-decoration: none; margin-left: 8px; }
    .vaga-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div style="text-align:center;margin-bottom:24px">
    <img src="assets/logo.png" alt="Sebastian Logo" height="100" />
    <h1> Sebastian Dashboard</h1>
    <br>
    <h3 class="">Fits gerados para agente ATS. Autorize cada vaga para liberar os links de CV e CL.</h3>
  </div>
  <div class="generic-bar">
    <span><i class="fa-solid fa-file-lines"></i> CVs genéricos:</span>
    <a class="btn btn-cv" href="src/pages/cv.html?job=generico" target="_blank"><i class="fa-solid fa-file-pdf"></i> CV PT</a>
    <a class="btn btn-cv" href="src/pages/cv.html?job=generico-en" target="_blank"><i class="fa-solid fa-file-pdf"></i> CV EN</a>
  </div>
  <div id="jobs-container"></div>

  <script src="src/json/candidate-data.js"></script>
  <script src="src/json/jobs-data.js"></script>
  <script src="src/js/index.js"></script>
</body>
</html>
