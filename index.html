<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sebastian - Dashboard</title>
  <link rel="icon" href="assets/logo.png" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="src/styles/global.css" />
  <link rel="stylesheet" href="src/styles/index.css" />
</head>
<body>

  <div class="page-header">
    <img src="assets/logo.png" alt="Sebastian Logo" height="100" />
    <h1>Sebastian Dashboard</h1>
    <br>
    <h3>Fits gerados para agente ATS. Autorize cada vaga para liberar os links de CV e CL.</h3>
  </div>

  <div class="generic-bar">
    <div class="generic-section">
      <span><i class="fa-solid fa-file-lines"></i> CVs genéricos:</span>
      <a class="btn btn-cv" href="src/pages/cv.html?job=generico&isGeneric=true" target="_blank">
        <i class="fa-solid fa-file-pdf"></i> CV PT
      </a>
      <a class="btn btn-cv" href="src/pages/cv.html?job=generico-en&isGeneric=true" target="_blank">
        <i class="fa-solid fa-file-pdf"></i> CV EN
      </a>
    </div>

    <div class="example-section example-dropdown">
      <label for="cv-select">
        <i class="fa-solid fa-file-lines"></i> CV exemplo:
      </label>
      <select id="cv-select" onchange="abrirCVDropdown(this.value)">
        <option value="">Escolher CV...</option>
        <option value="example-1|generico">Exemplo 1 - Marina (15 anos) - PT</option>
        <option value="example-1|generico-en">Exemplo 1 - Marina (15 anos) - EN</option>
        <option value="example-2|generico">Exemplo 2 - Rafael (1 ano) - PT</option>
        <option value="example-2|generico-en">Exemplo 2 - Rafael (1 ano) - EN</option>
        <option value="example-3|generico">Exemplo 3 - Felipe (5 anos) - PT</option>
        <option value="example-3|generico-en">Exemplo 3 - Felipe (5 anos) - EN</option>
      </select>
    </div>
  </div>

  <div id="jobs-container"></div>
  <script type="module" src="src/js/index.js"></script>
</body>
</html>
