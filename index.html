<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sebastian - Dashboard</title>
  <link rel="icon" href="assets/logo.png" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="src/styles/global.css" />
  <link rel="stylesheet" href="src/styles/index.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">

</head>
<body class="app-page">

  <div class="page-header">
    <div class="card card--ledger logo-ledger">
      <img src="assets/mordomo%20-%20full.png" alt="Sebastian Logo" />
    </div>
    <h1 class="fonte-baskerville">Sebastian · o mordomo</h1>
    <br>
    <h3 class="fonte-baskerville">O seu orquestrador de Currículo para ATS</h3>
  </div>

  <div class="generic-bar">
    <div class="generic-section">
      <span><i class="fa-solid fa-file-lines"></i> CVs genéricos:</span>
      <a class="btn btn-cv" href="src/pages/cv.html?job=generico&isGeneric=true" target="_blank">
        <i class="fa-solid fa-file-pdf"></i> CV PT
      </a>
      <a class="btn btn-cv" href="src/pages/cv.html?job=generico-en&isGeneric=true" target="_blank">
        <i class="fa-solid fa-file-pdf"></i> CV EN
      </a>
    </div>

    <div class="example-section example-dropdown" id="example-section" style="display:none">
      <label for="cv-select">
        <i class="fa-solid fa-file-lines"></i> CV exemplo:
      </label>
      <select id="cv-select" class="select" onchange="abrirCVDropdown(this.value)">
        <option value="">Escolher CV...</option>
      </select>
    </div>
  </div>
  <div class="container-coffee-link">
    <a class="coffee-link" href="src/pages/ajuda.html#cafe" target="_blank">
      <img src="assets/logo.png" alt="Me compre um café" />
    </a>
  </div>


  <div class="container-help-link">
    <a class="help-link" href="src/pages/ajuda.html" target="_blank">
      <i class="fa-solid fa-circle-question"></i>
    </a>
  </div>
  <div id="jobs-container"></div>
  <div class="candidaturas-bar">
    <button id="btn-salvar-candidaturas" class="btn-primary" onclick="onSalvarCandidaturas()">
      <i class="fa-solid fa-floppy-disk"></i> Salvar candidaturas
    </button>
    <span id="candidaturas-count" class="candidaturas-count"></span>
  </div>
  <script type="module" src="src/js/index.js"></script>
</body>
</html>
